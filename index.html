<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookCut</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
    }

    header p {
      margin-top: 8px;
      color: #ccc;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .hero {
      background: white;
      padding: 25px;
      border-radius: 18px;
      margin-top: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .hero h2 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #333;
    }

    .features {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }

    .feature {
      background: white;
      padding: 18px;
      border-radius: 15px;
    }
 .booking-box {
  display: none;
  background: white;
  padding: 20px;
  margin: 20px auto;
  border-radius: 15px;
  max-width: 500px;
}

.booking-box input,
.booking-box select,
.booking-box button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

.booking-box button {
  background: #111;
  color: white;
  cursor: pointer;
}
  </style>
</head>

<body>

  <header>
    <h1>✂️ BookCut</h1>
    <p>احجز حلاقتك بسهولة</p>
  </header>

  <main class="container">

    <section class="hero">
      <h2>أهلاً بيك في BookCut</h2>
      <p>احجز موعدك مع الحلاق اللي تختاره بدون انتظار.</p>

      <button onclick="bookNow()">
        احجز موعدك الآن
      </button>

      <button onclick="queueNow()">
        🎟️ احجز دور فوري
      </button>
    </section>

    <section class="features">

      <div class="feature">
        📅 <strong>حجز موعد</strong>
        <p>اختار اليوم والساعة المناسبة ليك.</p>
      </div>

      <div class="feature">
        🎟️ <strong>دور فوري</strong>
        <p>احجز رقمك في الطابور بدون موعد.</p>
      </div>

      <div class="feature">
        💈 <strong>محلات حلاقة</strong>
        <p>اكتشف محلات الحلاقة القريبة منك.</p>
      </div>

    </section>

  </main>
<script>
  function bookNow() {
    alert("هنفتح شاشة حجز الموعد قريبًا 💈");
  }

  function queueNow() {
    alert("هنفتح شاشة حجز الدور الفوري قريبًا 🎟️");
  }
</script>
  }
</script>
</body>
</html>
